name: Sidewalk
options:
  bundleIdPrefix: com.sidewalk
  deploymentTarget:
    iOS: '17.0'
packages:
  Pow:
    url: https://github.com/EmergeTools/Pow.git
    exactVersion: 1.0.6
targets:
  Sidewalk:
    type: application
    platform: iOS
    sources: [Sidewalk]
    dependencies:
      - package: Pow
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sidewalk.explore
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Sidewalk
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: Confirm you are near a place to unlock its story. Your check-in coordinates stay on your device.
        TARGETED_DEVICE_FAMILY: '1'
        SWIFT_VERSION: '5.0'
        MARKETING_VERSION: 0.1.0
        CURRENT_PROJECT_VERSION: 1
        CODE_SIGN_STYLE: Automatic
    scheme:
      gatherCoverageData: false
