name: Sidewalk
options:
  bundleIdPrefix: com.sidewalk
  deploymentTarget:
    iOS: '17.0'
packages:
  Pow:
    url: https://github.com/EmergeTools/Pow.git
    exactVersion: 1.0.6
targets:
  Sidewalk:
    type: application
    platform: iOS
    sources: [Sidewalk]
    dependencies:
      - package: Pow
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sidewalk.explore
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Sidewalk
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: Use your location for live walking directions, as a walking start, and to confirm arrival to collect a visit stamp. Starting coordinates are sent to Apple Maps for directions; check-in coordinates stay on your device.
        TARGETED_DEVICE_FAMILY: '1'
        SWIFT_VERSION: '5.0'
        MARKETING_VERSION: 0.1.0
        CURRENT_PROJECT_VERSION: 1
        CODE_SIGN_STYLE: Automatic
    scheme:
      gatherCoverageData: true
      testTargets:
        - SidewalkTests
  SidewalkTests:
    type: bundle.unit-test
    platform: iOS
    sources: [SidewalkTests]
    dependencies:
      - target: Sidewalk
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.sidewalk.explore.tests
