name: Sidewalk
options:
  bundleIdPrefix: com.sidewalk
  deploymentTarget:
    iOS: '17.0'
packages:
  Pow:
    url: https://github.com/EmergeTools/Pow.git
    exactVersion: 1.0.6
targets:
  Sidewalk:
    type: application
    platform: iOS
    sources: [Sidewalk]
    dependencies:
      - package: Pow
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sidewalk.explore
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: Sidewalk-Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: Sidewalk
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: Follow your active walk, including when your phone is locked, and confirm arrival for visit stamps. Starting coordinates are sent to Apple Maps for directions; check-in coordinates stay on your device. Pause or end the walk to stop tracking.
        INFOPLIST_KEY_NSCameraUsageDescription: Take a photo of a place for your private field guide.
        TARGETED_DEVICE_FAMILY: '1'
        SWIFT_VERSION: '5.0'
        MARKETING_VERSION: 0.1.0
        CURRENT_PROJECT_VERSION: 1
        CODE_SIGN_STYLE: Automatic
    scheme:
      gatherCoverageData: true
      testTargets:
        - SidewalkTests
  SidewalkTests:
    type: bundle.unit-test
    platform: iOS
    sources: [SidewalkTests]
    dependencies:
      - target: Sidewalk
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.sidewalk.explore.tests
